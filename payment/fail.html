<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#3182F6" />
  <title>결제 확인 필요 · 정산메이트</title>
  <style>
    :root{font-family:Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#191f28;background:#f6f8fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,440px);padding:32px 26px;border:1px solid #e5e8eb;border-radius:24px;background:#fff;box-shadow:0 16px 36px rgba(31,42,55,.08);text-align:center}.mark{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;margin:0 auto 18px;background:#fff1f0;color:#e74646;font-size:26px;font-weight:900}h1{margin:0 0 10px;font-size:1.45rem;letter-spacing:-.05em}p{margin:0;color:#6b7684;font-size:.93rem;line-height:1.65}.detail{display:none;margin:18px 0;padding:12px;border-radius:12px;background:#fff8f7;color:#8b4a45;font-size:.8rem;word-break:break-word}.detail.show{display:block}a{display:block;margin-top:20px;padding:15px;border-radius:13px;background:#3182f6;color:#fff;text-decoration:none;font-weight:800;font-size:.94rem}
  </style>
</head>
<body>
  <main class="card"><div class="mark">!</div><h1>결제를 완료하지 못했어요</h1><p>결제 정보가 확인되지 않았습니다. 다시 시도하거나 문의하기로 알려주세요.</p><div id="detail" class="detail"></div><a href="/">정산메이트로 돌아가기</a></main>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const result = { type:"payment_fail", code:params.get("code") || "", message:params.get("message") || "" };
      const detail = document.getElementById("detail");
      if (result.message) { detail.textContent = result.message; detail.classList.add("show"); }
      if (window.SettleMateNative && typeof window.SettleMateNative.onPaymentResult === "function") window.SettleMateNative.onPaymentResult(JSON.stringify(result));
      if (window.webkit?.messageHandlers?.settleMate) window.webkit.messageHandlers.settleMate.postMessage(result);
    })();
  </script>
</body>
</html>
