<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#3182F6" />
  <title>결제 확인 · 정산메이트</title>
  <style>
    :root{font-family:Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#191f28;background:#f6f8fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,440px);padding:32px 26px;border:1px solid #e5e8eb;border-radius:24px;background:#fff;box-shadow:0 16px 36px rgba(31,42,55,.08);text-align:center}.mark{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;margin:0 auto 18px;background:#eaf3ff;color:#2676ee;font-size:26px;font-weight:900}h1{margin:0 0 10px;font-size:1.45rem;letter-spacing:-.05em}p{margin:0;color:#6b7684;font-size:.93rem;line-height:1.65}.detail{display:none;margin:18px 0;padding:12px;border-radius:12px;background:#f7faff;color:#4e5968;font-size:.8rem;word-break:break-all}.detail.show{display:block}a{display:block;margin-top:20px;padding:15px;border-radius:13px;background:#3182f6;color:#fff;text-decoration:none;font-weight:800;font-size:.94rem}
  </style>
</head>
<body>
  <main class="card"><div class="mark">✓</div><h1>결제 확인을 진행하고 있어요</h1><p>결제 정보는 서버에서 최종 확인한 뒤 이용 권한에 반영해야 합니다.<br>정산메이트로 돌아가 결과를 확인해 주세요.</p><div id="detail" class="detail"></div><a href="/">정산메이트로 돌아가기</a></main>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const result = { type:"payment_success", orderId:params.get("orderId") || "", amount:params.get("amount") || "", paymentKey:params.get("paymentKey") || "" };
      const detail = document.getElementById("detail");
      if (result.orderId) { detail.textContent = `주문번호: ${result.orderId}`; detail.classList.add("show"); }
      // 네이티브 브리지에는 주문 상태 확인에 필요한 최소 정보만 전달합니다.
      if (window.SettleMateNative && typeof window.SettleMateNative.onPaymentResult === "function") window.SettleMateNative.onPaymentResult(JSON.stringify(result));
      if (window.webkit?.messageHandlers?.settleMate) window.webkit.messageHandlers.settleMate.postMessage(result);
    })();
  </script>
</body>
</html>
